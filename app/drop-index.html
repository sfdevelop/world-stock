<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD STOCK DROP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Drop/drop.min.css">
</head>

<body>
  <div class="drop-page">
    <div data-partial="Drop/header"></div>
    <main class="drop-home">
      <h1>WORLD STOCK DROP</h1>
      <section class="drop-brands" aria-label="Бренди">
        <ul class="drop-brands__list">
          <li class="drop-brands__item">
            <a class="drop-brands__card" href="#">
              <img src="images/Drop/brand-new-balance.jpg" alt="New Balance">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card" href="#">
              <img src="images/Drop/brand-salomon.jpg" alt="Salomon">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card drop-brands__card--adidas" href="#">
              <img src="images/Drop/brand-adidas.jpg" alt="Adidas">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card drop-brands__card--columbia" href="#">
              <img src="images/Drop/brand-columbia.jpg" alt="Columbia">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card drop-brands__card--asics" href="#">
              <img src="images/Drop/brand-asics.jpg" alt="Asics">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card" href="#">
              <img src="images/Drop/brand-skechers.jpg" alt="Skechers">
            </a>
          </li>
          <li class="drop-brands__item drop-brands__item--half">
            <a class="drop-brands__card drop-brands__card--armour" href="#">
              <img src="images/Drop/brand-under-armour.png" alt="Under Armour">
            </a>
          </li>
          <li class="drop-brands__item">
            <a class="drop-brands__card drop-brands__card--crocs" href="#">
              <img src="images/Drop/brand-crocs.png" alt="Crocs">
            </a>
          </li>
        </ul>
      </section>
    </main>
    <div data-partial="Drop/footer"></div>
  </div>
  <script src="js/Drop/partials-loader.js"></script>
  <script src="js/Drop/drop.min.js"></script>
</body>

</html>

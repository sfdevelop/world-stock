<article class="drop-card drop-card--unavailable" data-drop-card>
  <div class="drop-card__media">
    <label class="drop-preference__check">
      <input type="checkbox" checked>
      <div class="drop-preference__check-box">
        <img src="images/Drop/catalog/icon-check.svg" alt="" width="11" height="11">
      </div>
    </label>
    <button class="drop-card__favorite is-active" type="button" aria-pressed="true" aria-label="Прибрати з вподобань" data-drop-favorite>
      <img src="images/Drop/catalog/icon-heart.svg" alt="" width="18" height="16">
      <img src="images/icons/heart-2.svg" alt="" width="18" height="18">
    </button>
    <a class="drop-card__photo" href="drop-product.html">
      <div class="swiper drop-card__main">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="New Balance U530CRB" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
        </div>
      </div>
    </a>
    <div class="drop-card__thumbs">
      <button class="drop-card__prev" type="button" aria-label="Попереднє фото">
        <img src="images/icons/arrow-dark-slider.svg" alt="" width="7" height="12">
      </button>
      <div class="swiper drop-card__thumbs-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
          <div class="swiper-slide">
            <img src="images/Drop/catalog/product.jpg" alt="" width="1070" height="1600">
          </div>
        </div>
      </div>
      <button class="drop-card__next" type="button" aria-label="Наступне фото">
        <img src="images/icons/arrow-dark-slider.svg" alt="" width="7" height="12">
      </button>
    </div>
  </div>
  <a class="drop-card__body" href="drop-product.html">
    <div class="drop-card__gender">
      <p>Жінкам</p>
    </div>
    <div class="drop-card__title">
      <p>New Balance U530CRB</p>
    </div>
    <div class="drop-card__sizes">
      <p><strong>Розмір:</strong> 35, 36, 37, 38, 39, 40, 41, 42,5, 44,5, 45,5, 46 1/3, 47 2/3</p>
    </div>
    <div class="drop-card__wholesale">
      <p>Немає в наявності</p>
    </div>
    <div class="drop-card__retail">
      <p>РРЦ: <strong>150,90 ₴</strong></p>
    </div>
  </a>
</article>
